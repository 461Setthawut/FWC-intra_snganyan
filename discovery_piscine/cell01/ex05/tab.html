<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tab</title>
	<style>
		table {
			border-collapse: collapse;
			width: 600px;
		}

		td {
			border: 1px solid black;
			padding: 20px;
			width: 50%;
		}

		.first {
			background-color: #5c5142;
		}

		.second {
			background-color: #62d453;
		}
	</style>
</head>
<body>
	<table>
		<tr>
			<td class="first">Soil</td>ไ
			<td class="second">Plant</td>
		</tr>
	</table>
</body>
</html>
