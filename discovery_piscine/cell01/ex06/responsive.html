<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
		}

		table {
			border-collapse: collapse;
			table-layout: fixed;
			width: 100%;
			height: 100%;
		}

		td {
			border: 1px solid black;
			padding: 20px;
			width: 50%;
			box-sizing: border-box;
			word-wrap: break-word;
		}

		.first {
			background-color: #5c5142;
		}

		.second {
			background-color: #62d453;
		}
	</style>
</head>
<body>
	<table>
		<tr>
			<td class="first">Soil</td>
			<td class="second">Plant</td>
		</tr>
	</table>
</body>
</html>
